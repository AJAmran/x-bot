<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Screenshot placeholder: the delivery map with the 5 km service radius and a dropped pin">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#land)"/>

  <!-- stylised street grid -->
  <g stroke="#cbd5e1" stroke-width="2" opacity="0.9">
    <line x1="0" y1="140" x2="1280" y2="180"/>
    <line x1="0" y1="330" x2="1280" y2="300"/>
    <line x1="0" y1="520" x2="1280" y2="560"/>
    <line x1="210" y1="0" x2="250" y2="720"/>
    <line x1="640" y1="0" x2="600" y2="720"/>
    <line x1="1010" y1="0" x2="1060" y2="720"/>
  </g>
  <rect x="0" y="590" width="1280" height="130" fill="#bae6fd" opacity="0.75"/>

  <!-- service radius -->
  <circle cx="640" cy="360" r="230" fill="#22c55e" fill-opacity="0.10" stroke="#16a34a" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="640" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#16a34a" letter-spacing="1">5 KM DELIVERY RADIUS</text>

  <!-- kitchen -->
  <circle cx="640" cy="360" r="20" fill="#ea580c" stroke="#ffffff" stroke-width="4"/>
  <path d="M640 348 l-9 9 h3 v7 h5 v-5 h2 v5 h5 v-7 h3 z" fill="#ffffff"/>
  <text x="640" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Four Season Kitchen</text>

  <!-- customer pin -->
  <g transform="translate(880,250)">
    <path d="M0 0 c-15 -22 -34 -38 -34 -60 a34 34 0 1 1 68 0 c0 22 -19 38 -34 60 z" fill="#0f172a" stroke="#ffffff" stroke-width="4" transform="rotate(180)"/>
    <circle cx="0" cy="-60" r="11" fill="#ffffff"/>
  </g>

  <!-- status card -->
  <g transform="translate(80,90)">
    <rect width="330" height="86" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">LOCATION INTELLIGENCE</text>
    <text x="24" y="62" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#166534">2.14 km from Kitchen</text>
    <rect x="238" y="20" width="76" height="26" rx="13" fill="#dcfce7"/>
    <text x="276" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#16a34a" letter-spacing="1">SECURED</text>
  </g>

  <text x="640" y="690" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">docs/delivery-map.svg — replace with a real screenshot (see README)</text>
</svg>
