<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Screenshot placeholder: the SeasonBot landing page with the chat widget open">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- hero -->
  <text x="120" y="250" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="4">FOUR SEASON RESTAURANT</text>
  <text x="120" y="320" font-family="system-ui, sans-serif" font-size="62" font-weight="900" fill="#0f172a">The Future of</text>
  <text x="120" y="388" font-family="system-ui, sans-serif" font-size="62" font-weight="900" fill="url(#brand)">Conversational Dining</text>
  <rect x="120" y="428" width="520" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="120" y="456" width="430" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="120" y="500" width="200" height="52" rx="14" fill="#0f172a"/>
  <text x="220" y="532" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2">VIEW LIVE MENU</text>

  <!-- widget -->
  <g transform="translate(830,90)">
    <rect width="370" height="540" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="1" y="1" width="368" height="66" rx="35" fill="#ffffff"/>
    <line x1="0" y1="66" x2="370" y2="66" stroke="#f1f5f9" stroke-width="2"/>
    <rect x="22" y="18" width="32" height="32" rx="10" fill="#0f172a"/>
    <text x="66" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a" letter-spacing="1">FOUR SEASON</text>
    <circle cx="70" cy="50" r="4" fill="#22c55e"/>
    <text x="82" y="54" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">ACTIVE NOW</text>

    <rect x="20" y="92" width="210" height="46" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="34" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Assalamu Alaikum! How may</text>
    <rect x="120" y="150" width="230" height="66" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="134" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">I have added the grilled</text>
    <text x="134" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">chicken. Anything else?</text>
    <rect x="60" y="228" width="290" height="60" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="74" y="254" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Excellent choice. I also</text>
    <text x="74" y="274" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">recommend a cold drink.</text>

    <rect x="20" y="452" width="330" height="46" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="481" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">How can SeasonBot help you?</text>
    <circle cx="330" cy="475" r="16" fill="#ea580c"/>

    <line x1="0" y1="508" x2="370" y2="508" stroke="#f1f5f9" stroke-width="2"/>
    <text x="70" y="532" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ea580c" letter-spacing="1">CHAT</text>
    <text x="185" y="532" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#64748b" letter-spacing="1">MENU</text>
    <text x="300" y="532" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#64748b" letter-spacing="1">BAG</text>
  </g>

  <text x="640" y="690" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">docs/landing.svg — replace with a real screenshot (see README)</text>
</svg>
